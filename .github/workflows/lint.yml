name: Check

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "**.sh"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/lint.yml"

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run ruff
        run: python -m ruff check Python tests

      - name: Run tests
        run: python -m pytest

      - name: Compile Python scripts
        run: python -m py_compile $(find Python -name '*.py' -type f)

  shell-lint:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./Bash"
          severity: warning
